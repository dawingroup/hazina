openapi: 3.1.0
info:
  title: DawinOS integration API for Hazina
  version: 1.0.0-draft
  description: |
    Draft contract (ADR 0004). Read-only endpoints DawinOS exposes to Hazina's
    service account, and the webhook events DawinOS sends to Hazina.
    Amounts are integer minor units with an ISO 4217 currency.
servers:
  - url: https://{dawinos-host}/integration/v1
    variables: { dawinos-host: { default: dawinos.example } }
security: [{ serviceAccount: [] }]
paths:
  /subsidiaries:
    get:
      summary: Subsidiaries Hazina may map to legal entities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Subsidiary' } }
  /subsidiaries/{id}/financial-summaries:
    get:
      summary: Monthly-close summaries used to value the owner's stakes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FinancialSummary' } }
  /subsidiaries/{id}/directors-loan-balances:
    get:
      summary: Director's loan account balance per month-end
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DirectorsLoanBalance' } }
webhooks:
  dividend.declared:
    {
      post:
        {
          requestBody: { $ref: '#/components/requestBodies/Event' },
          responses: { '202': { description: Accepted } },
        },
    }
  dividend.paid:
    {
      post:
        {
          requestBody: { $ref: '#/components/requestBodies/Event' },
          responses: { '202': { description: Accepted } },
        },
    }
  directors_fee.payable:
    {
      post:
        {
          requestBody: { $ref: '#/components/requestBodies/Event' },
          responses: { '202': { description: Accepted } },
        },
    }
  capital_call.approved:
    {
      post:
        {
          requestBody: { $ref: '#/components/requestBodies/Event' },
          responses: { '202': { description: Accepted } },
        },
    }
  guarantee.recorded:
    {
      post:
        {
          requestBody: { $ref: '#/components/requestBodies/Event' },
          responses: { '202': { description: Accepted } },
        },
    }
components:
  securitySchemes:
    serviceAccount:
      { type: http, scheme: bearer, description: Short-lived token scoped to these endpoints }
  requestBodies:
    Event:
      required: true
      description: Signed with HMAC-SHA256 of the raw body in the x-dawinos-signature header (hex).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Event' }
  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer }
        currency: { type: string, enum: [UGX, USD, GBP, KES] }
    Subsidiary:
      type: object
      required: [id, name]
      properties:
        id:
          {
            type: string,
            examples: [dawin-finishes, dawin-advisory, dawin-capital, dawin-technology],
          }
        name: { type: string }
    FinancialSummary:
      type: object
      required: [subsidiaryId, month, revenue, profit, netAssets]
      properties:
        subsidiaryId: { type: string }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        revenue: { $ref: '#/components/schemas/Money' }
        profit: { $ref: '#/components/schemas/Money' }
        netAssets: { $ref: '#/components/schemas/Money' }
    DirectorsLoanBalance:
      type: object
      required: [subsidiaryId, monthEnd, balance, direction]
      properties:
        subsidiaryId: { type: string }
        monthEnd: { type: string, format: date }
        balance: { $ref: '#/components/schemas/Money' }
        direction: { type: string, enum: [owed_to_director, owed_by_director] }
    Event:
      type: object
      required: [eventId, type, occurredAt, data]
      properties:
        eventId: { type: string, description: Unique per event; repeats are ignored }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        data:
          type: object
          required: [subsidiaryId]
          properties:
            subsidiaryId: { type: string }
            amount: { $ref: '#/components/schemas/Money' }
            dueDate: { type: string, format: date }
            reference: { type: string }
